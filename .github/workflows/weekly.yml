name: Weekly Industry News

on:
  schedule:
    # cron 用的是 UTC。UTC 周一 01:30 = 北京时间周一 09:30（中国无夏令时）。
    # ⚠️ 改这个时间要同步改三处：这里、README 的「定时任务」表、CLAUDE.md 的
    # 「项目是什么」与「已知陷阱 → GitHub Actions」。漏改不会报错，只会让文档骗人。
    - cron: '30 1 * * 1'
  workflow_dispatch:        # 手动触发（Run workflow 按钮）

# ⚠️ 一旦声明 permissions，未列出的 scope 全部变 none。这里要写仓库是因为
# 推送成功之后要把跨周台账 pushed_history.json 提交回去（见最后一步）。
# 若仓库的 Settings → Actions → General → Workflow permissions 被设成
# Read repository contents permission，YAML 里的 contents: write 会被**夹掉**，
# git push 会 403 —— 修法在仓库设置里，不在这个文件里（README 有写）。
permissions:
  contents: write

# 同一时间只允许一次运行。cancel-in-progress 必须是 false：
# true 会在"消息已发出、台账还没提交"的窗口里把这次运行取消掉，那一期的记录就丢了。
concurrency:
  group: weekly-news
  cancel-in-progress: false

jobs:
  push-news:
    runs-on: ubuntu-latest
    # 窗口放宽到 14 天后正文变长、消息条数变多，20 分钟偏紧。
    timeout-minutes: 30
    steps:
      # fetch-depth: 0 —— 最后一步要 rebase 到远端分支，浅克隆下 rebase 不可靠。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Guard - 确认密钥文件未被跟踪
        run: |
          if git ls-files --error-unmatch Key >/dev/null 2>&1; then
            echo "::error::Key 文件被 git 跟踪，存在密钥泄露风险，已中止"; exit 1
          fi

      # setup-python@v7 移除了 pip-install input，依赖要单独装。
      - run: pip install -r requirements.txt

      - name: Run news bot
        env:
          # 主用 OPENROUTER_API_KEY。旧名 PERPLEXITY_API_KEY 一并传入是为了兼容 ——
          # 若仓库里只配了旧名，前者会是空串，main.py 的 load_config() 会回退到后者。
          # 没配的那个 Secret 展开成空串，不会报错。
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          # 网页站点根。用 vars（仓库变量）而不是 secrets —— 它不是密钥。
          # 没配时它展开成**空串**，而 load_config() 把空串当"用默认值"（不是"关闭"），
          # 所以这里留空不会让网页功能静默失效。真要关闭就把变量设成 off。
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
        run: python main.py

      # ⚠️ 这一步**故意不加 `if: always()`**。旧版（weekly_news.yml）加了，意味着
      # 推送失败时也提交台账，把从没送达读者的条目标成"已推送" → 下周被永久压制。
      # 没有 always()，上面任何一步失败都会跳过这里，那一期下周会重发一遍 —— 重复
      # 一期，总好过静默丢一条。
      #
      # 走到这一步意味着 python main.py 已成功退出，而 main.py 只在**全部消息推送
      # 成功之后**才写台账，所以这里的文件就是权威记录。
      - name: Commit history ledger and site
        run: |
          set -euo pipefail

          if [ ! -f pushed_history.json ]; then
            echo "::error::main.py 成功退出却没有生成 pushed_history.json，行为异常，已中止"
            exit 1
          fi
          # 站点是主产物之一。缺了它说明 build_site() 没跑到（或写失败），
          # 而群里已经发出去了带链接的消息 —— 必须红。
          if [ ! -d docs ]; then
            echo "::error::main.py 成功退出却没有生成 docs/，站点未产出，已中止"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # ⚠️ 只 add 这两个路径。绝不用 `git add -A` / `git add .` —— 工作区里
          # 躺着明文密钥文件 Key（虽然被 .gitignore 挡住）。这是安全边界，不是风格偏好。
          # 也不要用 `git add docs/*.md` 这种通配符：GH 的 run 是 bash -e，
          # 没有 nullglob，无匹配时会把字面量原样传给 git，job 直接死。
          git add -- pushed_history.json docs

          # ⚠️ 早退判断必须在 git add **之后**。原来写的是
          # `git diff --quiet -- pushed_history.json`，那会在台账没变时跳过整个提交，
          # 把站点一起漏掉。另一层原因：**未暂存的改动会让下面的 git rebase 直接失败**
          # （"cannot rebase: You have unstaged changes"），重试 3 次全挂 ——
          # 所以暂存集合必须等于被修改集合。
          if git diff --staged --quiet; then
            echo "台账与站点均无变化（本期没有新增条目），跳过提交"
            exit 0
          fi

          # 断言：暂存区里只允许出现枚举出来的这几个路径。
          # ⚠️ 文件名锁成 YYYY-MM-DD，不要写成 `[^/]+` —— `[^/]+` 会放过 `docs/.md`
          # 这种空名。枚举实际会生成的名字，比描述"允许的形状"稳。
          # ⚠️ 大小写严格：CI 是 Linux、大小写敏感，`docs/X.MD` 匹配不上就该红。
          # 这是**正确的失败方向**，别为了"宽容"改成 (md|MD)。
          # 路径穿越不需要额外防：`git diff --staged --name-only` 打印的是 git 规范化后的
          # 仓库相对路径，`git add docs/../Key` 暂存的是 `Key`、打印出来也是 `Key`，匹配不上。
          # --no-renames：不加的话重命名会打印新旧两个路径，行为随 git 版本漂移。
          allowed='^(pushed_history\.json|docs/index\.html|docs/[0-9]{4}-[0-9]{2}-[0-9]{2}\.(md|html))$'
          if git diff --staged --name-only --no-renames | grep -vE "$allowed" | grep -q .; then
            echo "::error::暂存区出现白名单外的路径："
            git diff --staged --name-only
            exit 1
          fi

          git commit -m "chore: update pushed_history.json and site [skip ci]"

          # 竞态：定时任务与手动触发可能撞上，期间远端可能已有新提交。
          # rebase 后再推，失败退避重试 3 次。
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            # 用 HEAD:refs/heads/... —— 不写死 main，且 detached HEAD 下也对。
            if git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"; then
              echo "台账已提交（第 ${attempt} 次尝试）"
              exit 0
            fi
            echo "推送失败，10 秒后重试（第 ${attempt} 次）"
            sleep 10
          done
          echo "::error::台账推送连续 3 次失败。消息已发出，但台账没落库 —— 下周会重复一期。"
          exit 1
